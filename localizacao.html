<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Localização | Chá de Casa Nova</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="card location-card">
<span class="location-mark" aria-hidden="true">⌖</span>
<h2 class="t">Localização da festa</h2>
<p class="location-intro">Esperamos você para celebrar esse momento especial com a gente.</p>
<section class="address-card" aria-label="Endereço da festa"><strong data-ev="local"></strong><span data-ev="endereco"></span><span data-ev="cidade"></span></section>
<a id="maps" class="btn map-btn" target="_blank" rel="noopener">ABRIR NO GOOGLE MAPS</a>
<p id="aviso" class="msg"></p>
<a class="btn sec" href="index.html">VOLTAR AO CONVITE</a>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script><script>
const m=document.getElementById("maps");
if(E.mapsUrl&&E.mapsUrl.startsWith("http")){m.href=E.mapsUrl}else{m.removeAttribute("href");m.setAttribute("aria-disabled","true");m.style.opacity=.5;showMsg(document.getElementById("aviso"),"err","O link do mapa será divulgado em breve.")}
</script></body></html>
